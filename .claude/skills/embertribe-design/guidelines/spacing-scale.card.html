<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base grid — sp-1 through sp-9" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-brand); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .cell { text-align: center; }
  .bar { background: var(--et-red); border-radius: var(--radius-xs); width: 100%; }
  .lbl { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-weight: 600; }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="bar" style="height:4px;width:4px"></div><div class="lbl">1·4</div></div>
  <div class="cell"><div class="bar" style="height:8px;width:8px"></div><div class="lbl">2·8</div></div>
  <div class="cell"><div class="bar" style="height:12px;width:12px"></div><div class="lbl">3·12</div></div>
  <div class="cell"><div class="bar" style="height:16px;width:16px"></div><div class="lbl">4·16</div></div>
  <div class="cell"><div class="bar" style="height:24px;width:24px"></div><div class="lbl">5·24</div></div>
  <div class="cell"><div class="bar" style="height:32px;width:32px"></div><div class="lbl">6·32</div></div>
  <div class="cell"><div class="bar" style="height:48px;width:48px"></div><div class="lbl">7·48</div></div>
  <div class="cell"><div class="bar" style="height:64px;width:64px"></div><div class="lbl">8·64</div></div>
</div>
</body>
</html>
