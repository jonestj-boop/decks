<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; height: 100vh; }
  .panel { display: flex; align-items: center; justify-content: center; }
  .white { background: var(--et-white); border-right: 1px solid var(--border-subtle); }
  .gray { background: var(--et-gray); }
  img { height: 60px; width: auto; }
</style>
</head>
<body>
<div class="panel white"><img src="../assets/logos/embertribe-napkin-horizontal.png" alt="Logo on white" /></div>
<div class="panel gray"><img src="../assets/logos/embertribe-napkin-horizontal.png" alt="Logo on cloudy gray" /></div>
</body>
</html>
