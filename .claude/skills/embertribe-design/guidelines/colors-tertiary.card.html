<!-- @dsCard group="Colors" viewport="700x180" name="Tertiary palette" subtitle="Azure, Soft Orchid, Shamrock, Amethyst, Bubblegum" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-brand); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 74px; }
  .meta { padding: 8px 10px; }
  .name { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .hex { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--et-azure)"></div><div class="meta"><div class="name">Azure</div><div class="hex">#30C0F2</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-orchid)"></div><div class="meta"><div class="name">Soft Orchid</div><div class="hex">#D839AE</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-shamrock)"></div><div class="meta"><div class="name">Shamrock</div><div class="hex">#2FC171</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-amethyst)"></div><div class="meta"><div class="name">Amethyst</div><div class="hex">#9847EE</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-bubblegum)"></div><div class="meta"><div class="name">Bubblegum</div><div class="hex">#F495C0</div></div></div>
</div>
</body>
</html>
