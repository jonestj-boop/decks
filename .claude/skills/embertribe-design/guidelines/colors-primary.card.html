<!-- @dsCard group="Colors" viewport="700x180" name="Primary palette" subtitle="Candy Apple Red, Charcoal, Cloudy Gray, Honey Yellow, Rich Black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-brand); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 74px; }
  .meta { padding: 8px 10px; }
  .name { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .hex { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--et-red)"></div><div class="meta"><div class="name">Candy Apple</div><div class="hex">#FF333C</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-charcoal)"></div><div class="meta"><div class="name">Charcoal</div><div class="hex">#474747</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-gray)"></div><div class="meta"><div class="name">Cloudy Gray</div><div class="hex">#DFDFDF</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-yellow)"></div><div class="meta"><div class="name">Honey Yellow</div><div class="hex">#FFB000</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-black)"></div><div class="meta"><div class="name">Rich Black</div><div class="hex">#000000</div></div></div>
</div>
</body>
</html>
