<!-- @dsCard group="Colors" viewport="700x180" name="Secondary palette" subtitle="Turquoise, Oxford Blue, Ultramarine, Coral, Soft Lime" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-brand); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 74px; }
  .meta { padding: 8px 10px; }
  .name { font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .hex { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--et-turquoise)"></div><div class="meta"><div class="name">Turquoise</div><div class="hex">#54DDDA</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-oxford)"></div><div class="meta"><div class="name">Oxford Blue</div><div class="hex">#131354</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-ultramarine)"></div><div class="meta"><div class="name">Ultramarine</div><div class="hex">#4E5AEA</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-coral)"></div><div class="meta"><div class="name">Coral Red</div><div class="hex">#F75E52</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--et-lime)"></div><div class="meta"><div class="name">Soft Lime</div><div class="hex">#DCED96</div></div></div>
</div>
</body>
</html>
