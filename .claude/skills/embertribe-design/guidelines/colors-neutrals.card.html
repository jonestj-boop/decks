<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ink ramp" subtitle="UI greys derived from Charcoal & Cloudy Gray" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-brand); }
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 60px; border-radius: var(--radius-xs); border: 1px solid var(--border-subtle); }
  .lbl { font-size: 10px; letter-spacing: .04em; color: var(--text-muted); text-align: center; font-weight: 600; }
</style>
</head>
<body>
<div class="ramp">
  <div class="cell"><div class="chip" style="background:var(--et-ink-900)"></div><div class="lbl">900</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-800)"></div><div class="lbl">800</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-700)"></div><div class="lbl">700</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-600)"></div><div class="lbl">600</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-500)"></div><div class="lbl">500</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-400)"></div><div class="lbl">400</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-300)"></div><div class="lbl">300</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-200)"></div><div class="lbl">200</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-100)"></div><div class="lbl">100</div></div>
  <div class="cell"><div class="chip" style="background:var(--et-ink-50)"></div><div class="lbl">50</div></div>
</div>
</body>
</html>
