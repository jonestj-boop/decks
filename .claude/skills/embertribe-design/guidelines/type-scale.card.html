<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Display → body, Quatro across the scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-brand); color: var(--et-black); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border-subtle); }
  .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); width: 108px; flex: none; font-weight: 600; }
  .s1 { font-weight: 700; font-size: 44px; letter-spacing: -0.02em; }
  .s2 { font-weight: 700; font-size: 30px; }
  .s3 { font-weight: 600; font-size: 22px; }
  .s4 { font-weight: 600; font-size: 16px; }
  .s5 { font-weight: 400; font-size: 16px; }
</style>
</head>
<body>
<div class="line"><span class="tag">H1 · Bold</span><span class="s1">Grow relentlessly</span></div>
<div class="line"><span class="tag">H2 · Bold</span><span class="s2">Grow relentlessly</span></div>
<div class="line"><span class="tag">H3 · Semibold</span><span class="s3">Grow relentlessly</span></div>
<div class="line"><span class="tag">Subhead · SB</span><span class="s4">GROW RELENTLESSLY</span></div>
<div class="line" style="border:none"><span class="tag">Body · Reg</span><span class="s5">We pair bold strategy with rigorous testing to find the growth others miss.</span></div>
</body>
</html>
