<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & shadows" subtitle="Soft-square corners + neutral elevation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-brand); display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  .grp { display: flex; gap: 16px; align-items: center; }
  .box { width: 64px; height: 64px; background: var(--et-white); border: 1px solid var(--border-subtle); display: flex; align-items: flex-end; justify-content: center; }
  .lbl { font-size: 10px; color: var(--text-muted); padding: 4px; font-weight: 600; }
  .sh { width: 74px; height: 64px; background: var(--et-white); border-radius: var(--radius-md); }
</style>
</head>
<body>
<div class="grp">
  <div class="box" style="border-radius:var(--radius-xs)"><span class="lbl">4</span></div>
  <div class="box" style="border-radius:var(--radius-sm)"><span class="lbl">8</span></div>
  <div class="box" style="border-radius:var(--radius-md)"><span class="lbl">12</span></div>
  <div class="box" style="border-radius:var(--radius-lg)"><span class="lbl">18</span></div>
  <div class="box" style="border-radius:var(--radius-pill)"><span class="lbl">pill</span></div>
</div>
<div class="grp">
  <div class="sh" style="box-shadow:var(--shadow-sm)"></div>
  <div class="sh" style="box-shadow:var(--shadow-md)"></div>
  <div class="sh" style="box-shadow:var(--shadow-lg)"></div>
  <div class="sh" style="box-shadow:var(--shadow-brand)"></div>
</div>
</body>
</html>
