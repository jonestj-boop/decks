<!-- @dsCard group="Type" viewport="700x180" name="Weights & roles" subtitle="Regular / SemiBold / Bold + the guidelines' role system" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-brand); color: var(--et-black); display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .w { font-size: 34px; margin-bottom: 2px; }
  .cap { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .roles div { padding: 3px 0; font-size: 13px; }
  .roles b { display: inline-block; width: 92px; }
</style>
</head>
<body>
<div>
  <div><span class="w" style="font-weight:400">Aa</span> <span class="cap">Regular · 400</span></div>
  <div><span class="w" style="font-weight:600">Aa</span> <span class="cap">SemiBold · 600</span></div>
  <div><span class="w" style="font-weight:700">Aa</span> <span class="cap">Bold · 700</span></div>
</div>
<div class="roles">
  <div><b>Navigation</b> Bold · ALL CAPS</div>
  <div><b>Header</b> Bold · Sentence case</div>
  <div><b>Subhead</b> SemiBold · ALL CAPS</div>
  <div><b>Body</b> Regular · Sentence case</div>
  <div><b>Bullets</b> — em dash marker</div>
</div>
</body>
</html>
