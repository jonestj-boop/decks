<!-- @dsCard group="Marketing Site" viewport="1280x820" name="Contact page" subtitle="Contact details + lead form" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact — EmberTribe</title>
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="image-slot.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-page); color: var(--text-primary); font-family: var(--font-body); }
  a:hover { opacity: 0.72; }
  @media (max-width: 900px) { .et-svc-row, .et-contact-grid { grid-template-columns: 1fr !important; } }
  @media (max-width: 780px) { .et-navlinks a, .et-navlinks > div > a span { display: none; } .et-footer-grid { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel" src="ContactPage.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const { useEffect } = React;
  function App() {
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    return (<React.Fragment><Nav active="contact" /><ContactPage /><Footer /></React.Fragment>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
