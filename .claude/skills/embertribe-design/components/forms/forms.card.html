<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 28px; background: var(--surface-page); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 28px; max-width: 640px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Textarea, Select, Checkbox } = window.EmberTribeDesignSystem_83a968;
  function Demo() {
    return (
      <div className="grid">
        <Input label="Work email" placeholder="you@company.com" />
        <Select label="Monthly budget" options={["Less than $10k", "$10k – $50k", "$50k+"]} />
        <div style={{ gridColumn: "1 / -1" }}>
          <Textarea label="What are your goals?" rows={3} placeholder="Tell us about the growth you're after…" />
        </div>
        <Input label="Website" defaultValue="notaurl" error="Enter a valid URL" />
        <div style={{ display: "flex", flexDirection: "column", gap: 14, justifyContent: "flex-end", paddingBottom: 6 }}>
          <Checkbox label="Subscribe to growth insights" defaultChecked />
          <Checkbox label="I'm a returning client" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
